
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Roboto, Arial, sans-serif;background:#ffffff}
        .uist-section{
            width:100%;
            background:#fff;
        }
        .uist-inner{
            width:100%;
            padding-top:48px;
            padding-left:64px;
            padding-right:64px;
            padding-bottom:0;
        }
        .uist-text{
            max-width:1100px;
            color:#111;
            font-size:34px;
            line-height:1.55;
            font-weight:300;
            letter-spacing:0.1px;
        }
        .uist-spacer{
            height:220px;
            width:100%;
        }
        .uist-rule-wrap{
            width:100%;
            padding-left:64px;
            padding-right:64px;
            padding-bottom:10px;
        }
        .uist-rule{
            height:3px;
            width:100%;
            background:#b8791f;
        }

        @media (max-width: 900px){
            .uist-inner{padding-left:24px;padding-right:24px}
            .uist-rule-wrap{padding-left:24px;padding-right:24px}
            .uist-text{font-size:26px}
            .uist-spacer{height:160px}
        }
    </style>
</head>
<body>
    <div class="uist-section">
        <div class="uist-inner">
            <div class="uist-text">
                The intimate size and intensive program make UIST an ideal opportunity to<br>
                exchange research results and ideas.
            </div>
        </div>
        <div class="uist-spacer"></div>
        <div class="uist-rule-wrap">
            <div class="uist-rule"></div>
        </div>
    </div>
</body>
</html>
