
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Roboto, Arial, sans-serif;background:#ffffff}
        .section-schedule{
            width:100%;
            background:#fff;
        }

        .schedule-wrap{
            width:100%;
            padding:0;
        }

        .row{
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:18px 28px;
            border-top:1px solid #e9e9e9;
        }
        .row:first-child{border-top:1px solid #e9e9e9}

        .label{
            color:#6f7780;
            font-size:34px;
            font-weight:400;
            letter-spacing:0.2px;
            line-height:1.1;
        }
        .date{
            color:#0b0b0b;
            font-size:34px;
            font-weight:700;
            letter-spacing:0.2px;
            line-height:1.1;
            white-space:nowrap;
        }

        .group-title{
            padding:22px 28px 14px 28px;
            border-top:1px solid #e9e9e9;
            border-bottom:1px solid #e9e9e9;
            color:#9a6a2a;
            font-size:24px;
            font-weight:700;
            letter-spacing:2.6px;
            text-transform:uppercase;
        }

        .spacer{
            height:18px;
            border-top:1px solid #e9e9e9;
            background:#fff;
        }

        .next-title{
            padding:18px 28px;
            border-top:1px solid #e9e9e9;
            color:#9a6a2a;
            font-size:26px;
            font-weight:700;
            letter-spacing:2.6px;
            text-transform:uppercase;
        }
    </style>
</head>
<body>
    <div class="section-schedule">
        <div class="schedule-wrap">
            <div class="row">
                <div class="label">Conditional acceptance</div>
                <div class="date">Jun 27, 2026</div>
            </div>

            <div class="group-title">POSTERS, DEMOS &amp; DOCTORAL SYMPOSIUM</div>

            <div class="row">
                <div class="label">Submission deadline</div>
                <div class="date">Jul 10, 2026</div>
            </div>

            <div class="row" style="border-bottom:1px solid #e9e9e9;">
                <div class="label">Acceptance notification</div>
                <div class="date">Aug 14, 2026</div>
            </div>

            <div class="next-title">WORKSHOPS</div>
        </div>
    </div>
</body>
</html>
