<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACM SIGCHI Footer – Contact and Credits</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;background:#ffffff;}

        /* Skip link: visible on focus for keyboard users */
        .skip-link{
            position:absolute;
            left:-9999px;
            top:auto;
            width:1px;
            height:1px;
            overflow:hidden;
        }
        .skip-link:focus{
            left:16px;
            top:16px;
            width:auto;
            height:auto;
            padding:10px 12px;
            background:#ffffff;
            color:#111827;
            border:2px solid #111827;
            border-radius:6px;
            z-index:1000;
        }

        .sigchi-footer-wrap{
            width:100%;
            background:#ffffff;
        }
        .sigchi-footer{
            width:100%;
            padding:34px 0 36px 0;
        }
        .sigchi-footer p{
            max-width:1200px;
            margin:0 auto;
            text-align:center;
            color:#6b7280;
            font-size:24px;
            line-height:1.35;
            font-weight:400;
            padding:0 24px;
        }
        .sigchi-footer a{
            color:#6b7280;
            text-decoration:underline;
            text-underline-offset:3px;
        }
    </style>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <main id="main-content">
        <div class="sigchi-footer-wrap">
            <div class="sigchi-footer">
                <p>
                    © 2026 ACM SIGCHI. Logo/iconography designed by
                    <a href="#" aria-label="Shuhong Wang link">Shuhong Wang</a>.
                    Detroit photography from
                    <a href="#" aria-label="Visit Detroit link">Visit Detroit</a>.
                    Please contact
                    <a href="#" aria-label="web chairs link">web chairs</a>
                    if you have any questions or suggestions about the website.
                </p>
            </div>
        </div>
    </main>
</body>
</html>
