
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        html, body { margin: 0; padding: 0; }
        * { box-sizing: border-box; }
        body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#ffffff; }

        .uist-sponsor-section{
            width: 100%;
            background: #ffffff;
            padding: 0;
            margin: 0;
        }

        .uist-card{
            width: 100%;
            background: #ffffff;
            border: 1px solid #e9e9e9;
            border-radius: 18px;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

        .uist-inner{
            width: 100%;
            padding: 34px 0 0 0;
        }

        .top-accent{
            width: 92px;
            height: 4px;
            background: #b77a1f;
            border-radius: 2px;
            margin: 0 auto;
        }

        .tier-row{
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-top: 34px;
            color: #8a6a2a;
            font-weight: 700;
            letter-spacing: 0.18em;
            font-size: 22px;
        }

        .tier-line{
            height: 2px;
            width: 240px;
            background: #e7d7b8;
            border-radius: 2px;
        }

        .tier-icon{
            width: 26px;
            height: 26px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .logos{
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 120px;
            padding: 44px 0 44px 0;
        }

        .logo-img{
            height: 78px;
            width: auto;
            display: block;
        }

        .divider{
            height: 1px;
            background: #e9e9e9;
            width: calc(100% - 120px);
            margin: 0 auto;
        }

        .cta{
            padding: 34px 0 44px 0;
            text-align: center;
            font-size: 28px;
            line-height: 1.35;
            color: #6b7280;
        }

        .cta strong{
            color: #111111;
            font-weight: 800;
        }

        .cta a{
            color: #007a87;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .ext{
            display: inline-flex;
            vertical-align: -3px;
            margin-left: 6px;
        }

        .ext svg{
            width: 22px;
            height: 22px;
            stroke: #007a87;
        }

        @media (max-width: 980px){
            .tier-line{ width: 160px; }
            .logos{ gap: 56px; padding: 36px 0; }
            .logo-img{ height: 64px; }
            .cta{ font-size: 22px; padding: 28px 18px 38px; }
            .divider{ width: calc(100% - 48px); }
        }

        @media (max-width: 560px){
            .tier-row{ font-size: 18px; }
            .tier-line{ width: 110px; }
            .logos{ flex-direction: column; gap: 22px; }
        }
    </style>
</head>
<body>
    <div class="uist-sponsor-section">
        <div class="uist-card">
            <div class="uist-inner">
                <div class="top-accent"></div>

                <div class="tier-row">
                    <div class="tier-line"></div>
                    <span class="tier-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M4 9.2 7.6 5h8.8L20 9.2l-8 10.3L4 9.2Z" fill="#8a6a2a"/>
                            <path d="M7.6 5 12 9.2 16.4 5" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
                            <path d="M4 9.2h16" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
                        </svg>
                    </span>
                    <div style="display:flex;align-items:center;gap:0;">
                        <span>GOLD</span>
                    </div>
                    <div class="tier-line"></div>
                </div>

                <div class="logos">
                    <img class="logo-img" src="https://placehold.co/360x120/png?text=Adobe" alt="Adobe logo in red with stylized A icon and the word Adobe">
                    <img class="logo-img" src="https://placehold.co/420x120/png?text=AUTODESK" alt="Autodesk logo in black with a geometric mark and the word AUTODESK">
                </div>

                <div class="divider"></div>

                <div class="cta">
                    <strong>Interested in sponsoring UIST 2026?</strong>
                    Check our
                    <a href="#" aria-label="Sponsor page (opens in a new tab)">Sponsor page</a>
                    <span class="ext" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 3h7v7"></path>
                            <path d="M10 14 21 3"></path>
                            <path d="M21 14v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h6"></path>
                        </svg>
                    </span>
                    or contact
                    <a href="#" aria-label="sponsorship2026@uist.org (opens in a new tab)">sponsorship2026@uist.org</a>
                    <span class="ext" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 3h7v7"></path>
                            <path d="M10 14 21 3"></path>
                            <path d="M21 14v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h6"></path>
                        </svg>
                    </span>.
                </div>
            </div>
        </div>
    </div>
</body>
</html>
