
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#fff}
    </style>
</head>
<body>
    <div class="section-wrap">
        <style>
            .section-wrap{
                width:100%;
                background:#ffffff;
            }

            .section-inner{
                width:100%;
                padding: 18px 0 0 0;
            }

            .content{
                width:100%;
                padding-left: 120px;
                padding-right: 70px;
            }

            .rule{
                height:1px;
                background:#e9e9e9;
                width:100%;
            }

            .row{
                display:flex;
                align-items:center;
                justify-content:space-between;
                padding: 18px 0;
                border-bottom:1px solid #ededed;
            }

            .row:last-of-type{
                border-bottom:1px solid #ededed;
            }

            .label{
                font-size:30px;
                line-height:1.2;
                font-weight:400;
                color:#6f7780;
                letter-spacing:0.1px;
            }

            .value{
                font-size:28px;
                line-height:1.2;
                font-weight:700;
                color:#111111;
                letter-spacing:0.2px;
            }

            .spacer{
                height: 40px;
            }

            .cta-row{
                padding-top: 22px;
            }

            .cta{
                display:inline-flex;
                align-items:center;
                gap:14px;
                padding: 14px 18px;
                border:2px solid #a56a1f;
                border-radius:6px;
                background:#ffffff;
                color:#a56a1f;
                font-size:28px;
                font-weight:500;
                text-decoration:none;
                line-height:1;
            }

            .cta .arrow{
                font-size:30px;
                font-weight:600;
                transform: translateY(-1px);
            }

            .bottom-space{
                height: 330px;
            }

            .card-hint{
                width:100%;
                padding: 0 0 0 0;
            }

            .card{
                width:100%;
                height: 70px;
                border:1px solid #ececec;
                border-radius:22px;
                background:#ffffff;
            }

            @media (max-width: 900px){
                .content{padding-left:24px;padding-right:24px}
                .label{font-size:22px}
                .value{font-size:20px}
                .cta{font-size:20px}
            }
        </style>

        <div class="section-inner">
            <div class="content">
                <div class="rule"></div>

                <div class="row">
                    <div class="label">Submission deadline</div>
                    <div class="value">Jul 10, 2026</div>
                </div>

                <div class="row">
                    <div class="label">Acceptance notification</div>
                    <div class="value">TBA</div>
                </div>

                <div class="spacer"></div>

                <div class="cta-row">
                    <a class="cta" href="#">
                        <span>Full Call for Participation</span>
                        <span class="arrow">→</span>
                    </a>
                </div>

                <div class="bottom-space"></div>

                <div class="card-hint">
                    <div class="card"></div>
                </div>
            </div>
        </div>

        <script>
            // no JS needed for this static section
        </script>
    </div>
</body>
</html>
