
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#eef3f7}
        .uist-wrap{width:100%;background:#eef3f7}
        .topbar{
            height:86px;
            background:#dfe8f1;
            border-bottom:1px solid rgba(0,0,0,.08);
            position:relative;
        }
        .menu-btn{
            position:absolute;
            right:34px;
            top:18px;
            width:78px;
            height:54px;
            border:1px solid rgba(0,0,0,.18);
            border-radius:8px;
            background:rgba(255,255,255,.25);
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .menu-icon{
            width:34px;
            height:22px;
            display:flex;
            flex-direction:column;
            justify-content:space-between;
        }
        .menu-icon span{
            display:block;
            height:3px;
            background:#3a3a3a;
            border-radius:2px;
            opacity:.9;
        }

        .hero{
            position:relative;
            width:100%;
            min-height:720px;
            overflow:hidden;
            background:#cfd9e3;
        }
        .hero-bg{
            position:absolute;
            inset:0;
            width:100%;
            height:100%;
            object-fit:cover;
        }
        .hero-overlay{
            position:absolute;
            inset:0;
            background:
                radial-gradient(1200px 700px at 50% 20%, rgba(255,255,255,.10), rgba(255,255,255,.55) 55%, rgba(255,255,255,.78) 78%, rgba(255,255,255,.92) 100%),
                linear-gradient(to bottom, rgba(0,0,0,.05), rgba(255,255,255,.0) 35%, rgba(255,255,255,.55) 70%, rgba(255,255,255,.92));
            pointer-events:none;
        }

        .hero-center{
            position:relative;
            width:100%;
            display:flex;
            flex-direction:column;
            align-items:center;
            padding-top:210px;
            padding-bottom:120px;
        }

        .logo{
            width:min(520px, 78vw);
            height:auto;
            opacity:.95;
        }

        .meta-row{
            margin-top:18px;
            display:flex;
            gap:34px;
            align-items:center;
            justify-content:center;
            flex-wrap:wrap;
            color:#2f2f2f;
            font-size:22px;
            letter-spacing:.2px;
        }
        .meta-row .dot{
            width:6px;height:6px;border-radius:50%;
            background:rgba(0,0,0,.25);
            display:inline-block;
            transform:translateY(-1px);
        }
        .meta-link{
            color:#2f2f2f;
            text-decoration:underline;
            text-decoration-color:#2a7f8a;
            text-decoration-thickness:3px;
            text-underline-offset:6px;
        }

        .replay{
            position:absolute;
            right:34px;
            top:420px;
            background:rgba(70,70,70,.85);
            color:#fff;
            border-radius:6px;
            padding:10px 14px;
            display:flex;
            align-items:center;
            gap:10px;
            font-size:18px;
            box-shadow:0 2px 0 rgba(0,0,0,.12);
            user-select:none;
        }
        .replay .icon{
            width:28px;height:28px;
            border-radius:4px;
            display:flex;
            align-items:center;
            justify-content:center;
            background:rgba(255,255,255,.08);
        }
        .replay svg{display:block}

        .ann-wrap{
            width:100%;
            padding:34px 0 44px 0;
            background:transparent;
        }
        .ann-card{
            width:min(980px, calc(100% - 120px));
            margin-left:auto;
            margin-right:auto;
            background:rgba(255,255,255,.72);
            border:1px solid rgba(0,0,0,.10);
            border-radius:12px;
            box-shadow:0 1px 0 rgba(0,0,0,.05);
            overflow:hidden;
        }
        .ann-head{
            display:flex;
            align-items:center;
            gap:12px;
            padding:22px 26px 14px 26px;
            color:#8a6a2a;
            font-weight:700;
            letter-spacing:2px;
            font-size:20px;
        }
        .ann-head .megaphone{
            width:22px;height:22px;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .ann-divider{
            height:1px;
            background:rgba(0,0,0,.12);
            margin:0 26px;
        }
        .ann-item{
            display:flex;
            align-items:flex-start;
            justify-content:space-between;
            gap:18px;
            padding:22px 26px 26px 26px;
        }
        .ann-left{
            display:flex;
            gap:14px;
            align-items:flex-start;
            min-width:0;
        }
        .tri{
            color:#1a8a9a;
            font-size:18px;
            line-height:26px;
            margin-top:2px;
        }
        .ann-text{
            min-width:0;
        }
        .ann-title{
            font-size:22px;
            font-weight:700;
            color:#111;
            line-height:1.2;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
            max-width:720px;
        }
        .ann-desc{
            margin-top:8px;
            font-size:18px;
            color:#5a5f66;
            line-height:1.35;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
            max-width:720px;
        }
        .ann-date{
            font-size:18px;
            color:#6b7178;
            padding-top:6px;
            white-space:nowrap;
        }

        @media (max-width: 820px){
            .replay{right:18px}
            .ann-card{width:calc(100% - 40px)}
            .meta-row{font-size:18px; gap:18px}
            .ann-title,.ann-desc{max-width:520px}
        }
        @media (max-width: 520px){
            .hero-center{padding-top:180px}
            .replay{top:380px}
            .ann-item{flex-direction:column; align-items:flex-start}
            .ann-date{padding-top:0}
            .ann-title,.ann-desc{max-width:100%}
        }
    </style>
</head>
<body>
    <div class="uist-wrap">
        <div class="topbar">
            <div class="menu-btn" aria-label="Menu">
                <div class="menu-icon" aria-hidden="true">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </div>

        <div class="hero">
            <img class="hero-bg" src="https://placehold.co/1600x900/png?text=Detroit+skyline+background" alt="A wide hero background image showing a hazy city skyline with tall buildings and a riverfront, used as the UIST 2026 page header background.">
            <div class="hero-overlay"></div>

            <div class="hero-center">
                <img class="logo" src="https://placehold.co/900x260/png?text=UIST+2026+logo" alt="UIST 2026 logo in gold with a stylized sunburst and the text UIST 2026 centered over the skyline.">
                <div class="meta-row">
                    <div>November 2–5, 2026</div>
                    <span class="dot" aria-hidden="true"></span>
                    <div>Detroit, MI USA</div>
                    <span class="dot" aria-hidden="true"></span>
                    <a class="meta-link" href="#" aria-label="Renaissance Center">Renaissance Center</a>
                </div>
            </div>

            <div class="replay" role="button" tabindex="0" aria-label="Replay video">
                <div class="icon" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <path d="M20 12a8 8 0 1 1-2.34-5.66" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
                        <path d="M20 4v6h-6" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div>Replay video</div>
            </div>
        </div>

        <div class="ann-wrap">
            <div class="ann-card">
                <div class="ann-head">
                    <div class="megaphone" aria-hidden="true">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                            <path d="M4 10v4c0 .55.45 1 1 1h2l4 4v-8l-4 4H5c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h2l4-4v8l-4-4H5c-.55 0-1 .45-1 1Z" fill="#8a6a2a" opacity=".0"/>
                            <path d="M3 10v4c0 .55.45 1 1 1h2l7 4V5L6 9H4c-.55 0-1 .45-1 1Z" fill="#8a6a2a"/>
                            <path d="M16 9.5c1.2 1.2 1.2 3.8 0 5" stroke="#8a6a2a" stroke-width="2" stroke-linecap="round"/>
                            <path d="M18.5 7c2.6 2.6 2.6 7.4 0 10" stroke="#8a6a2a" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <div>ANNOUNCEMENTS</div>
                </div>
                <div class="ann-divider"></div>
                <div class="ann-item">
                    <div class="ann-left">
                        <div class="tri" aria-hidden="true">▶</div>
                        <div class="ann-text">
                            <div class="ann-title">Page Limit Reintroduced for UIST 2026 Papers</div>
                            <div class="ann-desc">This year we have decided to reintroduce a fixed page limit for papers. T...</div>
                        </div>
                    </div>
                    <div class="ann-date">February 2026</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function(){
            const replay = document.querySelector('.replay');
            const onActivate = () => {
                replay.style.transform = 'translateY(1px)';
                setTimeout(()=>replay.style.transform='translateY(0px)', 120);
            };
            replay.addEventListener('click', onActivate);
            replay.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); onActivate(); }});
        })();
    </script>
</body>
</html>
